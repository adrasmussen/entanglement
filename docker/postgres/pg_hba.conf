# local-dev only: requires TLS for every non-local connection, matching
# common/src/db/postgres.rs which always connects over rustls. `local` (unix
# socket) stays trust-only so the /docker-entrypoint-initdb.d/schema.sql init
# script can run without needing a password.
# TYPE    DATABASE        USER            ADDRESS                 METHOD
local     all             all                                     trust
hostssl   all             all             0.0.0.0/0               scram-sha-256
hostssl   all             all             ::0/0                   scram-sha-256
host      all             all             0.0.0.0/0               reject
host      all             all             ::0/0                   reject
