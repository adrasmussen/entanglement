# local-dev only: authz_backend = "tomlfile" reads the [groups.*] table below
# for group-membership checks (common/src/auth/tomlfile.rs TomlAuthzFile).
#
# authn is x509cert (mTLS), not tomlfile -- identity comes from the client
# cert's CN (docker/dev-certs/client.crt, CN=dev), not a password. the
# [users.*] table below is unused (TomlAuthnFile is never invoked over HTTP,
# see docker/NOTES.md) but harmless to leave in place.
#
# "dev" here must match: the client cert CN generated by docker/certgen/generate.sh,
# and be listed as a member of whichever group a library/collection's `gid` uses.

[users.dev]
password = "devpassword"

[groups.devgroup]
members = ["dev"]
