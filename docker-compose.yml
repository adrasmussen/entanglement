networks:
  entg-net:
    driver: bridge

volumes:
  pg-data:
  media-srv:

services:
  # one-shot: generates a throwaway dev CA + server cert/key (shared by postgres
  # and server) and a client cert (CN=dev, for mTLS -- see docker/NOTES.md for
  # why). bind-mounted (not a named volume) so client.p12 is easy to grab off
  # the host filesystem for importing into a browser.
  certgen:
    image: alpine:3.20
    entrypoint: ["sh"]
    command: ["-c", "apk add --no-cache openssl >/dev/null && sh /scripts/generate.sh"]
    environment:
      # export password for client.p12, from the gitignored ./.env
      ENTG_CLIENT_P12_PASSWORD: ${ENTG_CLIENT_P12_PASSWORD:?ENTG_CLIENT_P12_PASSWORD is not set -- copy .env.example to .env and set it}
    volumes:
      - ./docker/dev-certs:/certs
      - ./docker/certgen:/scripts:ro
    networks:
      - entg-net

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: entanglement
      POSTGRES_USER: entanglement
      # from the gitignored ./.env (see .env.example); only applied when the
      # pg-data volume is first initialised -- see QUICKSTART "Changing the
      # database password" for existing volumes
      POSTGRES_PASSWORD: ${ENTG_DB_PASSWORD:?ENTG_DB_PASSWORD is not set -- copy .env.example to .env and set it}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      # postgres 18+ images use pg_ctlcluster-style layout and expect a single
      # mount at /var/lib/postgresql (not .../data) -- see docker-library/postgres#1259
      - pg-data:/var/lib/postgresql
      - ./docker/dev-certs:/certs:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # applied automatically on first init by the official postgres entrypoint;
      # this is the reverse-engineered schema from plan §3 gap #2 / db/schema.sql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
    networks:
      - entg-net
    # published for host-side GUI clients (pgAdmin, TablePlus, psql) -- loopback
    # only, like the server port; override with ENTG_DB_PORT (see .env.example).
    # pg_hba.conf still requires TLS + scram-sha-256 for every non-socket
    # connection, so clients need sslmode=require and the dev password.
    ports:
      - "127.0.0.1:${ENTG_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entanglement -d entanglement"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    # dbtool shares this image tag so the two can never drift apart (a stale
    # separately-tagged dbtool image would miss entrypoint/config changes)
    image: entanglement-server:dev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # server/src/main.rs: tracing_subscriber uses EnvFilter::from_default_env(),
      # which is silent unless RUST_LOG is set
      RUST_LOG: info
      # substituted into the config.toml template by docker/entrypoint.sh
      ENTG_DB_PASSWORD: ${ENTG_DB_PASSWORD:?ENTG_DB_PASSWORD is not set -- copy .env.example to .env and set it}
    depends_on:
      postgres:
        condition: service_healthy
      certgen:
        condition: service_completed_successfully
    volumes:
      - ./docker/dev-certs:/certs:ro
      # template: entrypoint.sh renders /etc/entanglement/config.toml from it
      - ./docker/entanglement/config.toml:/etc/entanglement/config.toml.in:ro
      - ./docker/entanglement/users.toml:/etc/entanglement/users.toml:ro
      # point this at a host folder of test photos/video; read-only, matching
      # server/src/main.rs's startup check that media_srcdir is NOT writable
      - ./media-src:/media/src:ro
      - media-srv:/media/srv
    networks:
      - entg-net
    # host-local only, matching the "owned host, not public cloud" deployment model.
    # the bind address is deliberately hard-coded to 127.0.0.1 (never 0.0.0.0/[::])
    # so that only the port can be overridden; ENTG_HTTPS_PORT (from the shell or
    # ./.env, see .env.example) moves it off the default to avoid clashing with
    # other local stacks.  8443 inside the container is config.toml's socket.
    ports:
      - "127.0.0.1:${ENTG_HTTPS_PORT:-8444}:8443"

  # one-off admin tool, not a long-running service -- invoke with e.g.:
  #   docker compose --profile tools run --rm dbtool entg-db \
  #     --config /etc/entanglement/config.toml \
  #     add-library --path <subdir-of-media-src> --uid dev --gid devgroup
  dbtool:
    image: entanglement-server:dev
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/entrypoint.sh"]
    profiles: ["tools"]
    environment:
      ENTG_DB_PASSWORD: ${ENTG_DB_PASSWORD:?ENTG_DB_PASSWORD is not set -- copy .env.example to .env and set it}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/dev-certs:/certs:ro
      # template: entrypoint.sh renders /etc/entanglement/config.toml from it
      - ./docker/entanglement/config.toml:/etc/entanglement/config.toml.in:ro
      - ./docker/entanglement/users.toml:/etc/entanglement/users.toml:ro
    networks:
      - entg-net
